name: Casino full checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  full-test-suite:
    name: Full project test suite
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package.json
            apps/mobile/package.json
            apps/api/package.json

      - name: Install all workspace dependencies
        run: npm install --no-audit --no-fund

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run all project checks and regression tests
        run: npm test
